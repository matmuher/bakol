{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>♭akol | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0f1113; }
        .login-box { width: 100%; max-width: 380px; padding: 40px; background: #16191c; border: 1px solid #2c3034; border-radius: 24px; text-align: center; }
        .login-input { background: #000; border: 1px solid #444; color: white; border-radius: 12px; padding: 12px; text-align: center; font-weight: 600; }
        .login-input::placeholder { color: #555; }
        .text-75 { color: #bdc3c7 !important; letter-spacing: 1px; font-weight: 700; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo mb-4">
        <span class="flat" style="color:var(--primary-blue); font-size: 4rem; font-weight:700;">♭</span>
        <span style="font-size: 3rem; font-weight:700; color:white;">akol</span>
    </div>
    
    <p class="text-75 mb-4 small">ENTER USERNAME TO CONTINUE</p>
    
    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" class="form-control login-input mb-3" placeholder="Username" required autofocus autocomplete="off">
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2" style="border-radius: 12px;">ENTER</button>
    </form>
</div>

</body>
</html>
