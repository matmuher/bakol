<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#9837;akol: train musical ear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body { 
            background-color: #0f1113; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            min-height: 100vh;
        }
        
        /* 1. Branding */
        .logo-container { margin-top: 50px; text-align: center; margin-bottom: 30px; }
        .logo { font-size: 2.5rem; font-weight: 700; display: inline-flex; align-items: baseline; }
        .logo .flat { color: #0d6efd; font-size: 3.2rem; margin-right: -2px; line-height: 0; }
        .logo .name { font-size: 2rem; text-transform: lowercase; }
        .tagline { display: block; color: #666; font-size: 0.95rem; margin-top: 5px; }
        .tagline u { text-decoration-color: #444; }

        /* 2. The Stage */
        .chord-stage {
            position: relative;
            height: 180px; 
            width: 100%;
            max-width: 800px;
            margin: 0 auto 30px auto;
            background: #16191c;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2c3034;
            cursor: pointer;
        }

        .placeholder-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 5;
            text-align: center;
            font-weight: 700;
            width: 100%;
        }

        /* 3. The Timeline */
        #conveyor {
            display: flex;
            position: absolute;
            left: 50%; 
            white-space: nowrap;
            height: 100%;
            align-items: center;
        }

        .chord-unit {
            position: absolute;
            width: 220px;
            transform: translateX(-50%);
            text-align: center;
            font-weight: 900;
            line-height: 1;
            pointer-events: none;
        }

        /* 4. Functional UI */
        #file-input { display: none; }
        
        .loader-overlay { 
            position: absolute; 
            z-index: 10; 
            display: none; 
            background: rgba(15, 17, 19, 0.9); 
            width: 100%; height: 100%; 
            align-items: center; justify-content: center; 
        }

        audio { 
            filter: invert(100%) sepia(100%) saturate(600%) hue-rotate(185deg) brightness(0.85);
            height: 40px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="logo-container">
        <div class="logo">
            <span class="flat">&#9837;</span><span class="name">akol</span>
        </div>
        <span class="tagline">train musical ear by listening <u>your</u> songs</span>
    </div>

    <form id="upload-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input id="file-input" name="track" type="file" onchange="autoSubmit()"/>
        <div class="chord-stage shadow-lg" onclick="document.getElementById('file-input').click()">
            <div id="loader" class="loader-overlay"><div class="spinner-border text-primary"></div></div>

            {% if not chords %}
                <div class="placeholder-text">Click to analyze track</div>
            {% else %}
                <div id="conveyor">
                    {% for item in chords %}
                        <div class="chord-unit" data-start="{{ item.start }}" data-end="{{ item.end }}">
                            {{ item.chord }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        </div>
    </form>

    {% if file_url %}
        <div class="mx-auto" style="max-width: 500px; padding-bottom: 50px;">
            <audio id="player" controls src="{{ file_url }}" class="w-100"></audio>
        </div>
    {% endif %}
</div>

{{ chords|json_script:"chords-raw" }}

<script>
    const chords = JSON.parse(document.getElementById('chords-raw').textContent || "[]");
    const player = document.getElementById('player');
    const conveyor = document.getElementById('conveyor');
    
    const PIXELS_PER_SECOND = 220; 
    
    // Constant Zone Config (seconds)
    const DEADZONE = 0.25; 
    const FALLOFF_SPEED = 0.7; 

    function autoSubmit() {
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('upload-form').submit();
    }

    function interpolateColor(distance) {
        if (distance < DEADZONE) return `rgb(13, 110, 253)`;
        const adjustedDist = distance - DEADZONE;
        const factor = Math.max(0, 1 - (adjustedDist / FALLOFF_SPEED)); 
        const r = Math.round(80 + (13 - 80) * factor);
        const g = Math.round(80 + (110 - 80) * factor);
        const b = Math.round(80 + (253 - 80) * factor);
        return `rgb(${r}, ${g}, ${b})`;
    }

    function renderFrame() {
        if (!player || !conveyor) return;

        const time = player.currentTime;
        const totalOffset = time * PIXELS_PER_SECOND;
        conveyor.style.transform = `translateX(-${totalOffset}px)`;

        document.querySelectorAll('.chord-unit').forEach((el) => {
            const mid = (parseFloat(el.dataset.start) + parseFloat(el.dataset.end)) / 2;
            const distance = Math.abs(time - mid);
            
            el.style.left = `${mid * PIXELS_PER_SECOND}px`;

            let intensity = 1.0;
            if (distance > DEADZONE) {
                intensity = Math.max(0, 1 - ((distance - DEADZONE) / FALLOFF_SPEED));
            }

            el.style.fontSize = (1.5 + (3.0 * intensity)) + "rem";
            el.style.color = interpolateColor(distance);
            el.style.opacity = Math.max(0.25, intensity); 
            
            // REDUCED GLOW: Max shadow radius cut from 25px to 12px, opacity at 0.2
            if (distance < DEADZONE + 0.1) {
                const glowIntensity = distance < DEADZONE ? 1 : 1 - ((distance - DEADZONE) * 10);
                el.style.textShadow = `0 0 ${12 * glowIntensity}px rgba(13,110,253,0.2)`;
            } else {
                el.style.textShadow = 'none';
            }
        });

        requestAnimationFrame(renderFrame);
    }

    if (player && chords.length > 0) {
        requestAnimationFrame(renderFrame);
    }
</script>
</body>
</html>
