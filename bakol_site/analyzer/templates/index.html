<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>&#9837;akol AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f1113; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Branding */
        .logo { font-size: 2.5rem; font-weight: 700; display: flex; align-items: baseline; justify-content: center; margin-top: 30px; }
        .logo .flat { color: #0d6efd; font-size: 3rem; margin-right: -2px; }
        .logo .name { font-size: 1.8rem; text-transform: lowercase; }

        /* Smaller Stage */
        .chord-stage {
            position: relative;
            height: 140px; /* Reduced from 250px */
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            background: #16191c;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2c3034;
            cursor: pointer;
            transition: background 0.3s;
        }
        .chord-stage:hover { background: #1c1f23; border-color: #3d4248; }
        
        /* The Conveyor */
        #conveyor {
            display: flex;
            position: absolute;
            left: 50%; /* Start from center */
            white-space: nowrap;
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            will-change: transform;
        }

        .chord-unit {
            min-width: 160px; /* Width of one chord "slot" */
            text-align: center;
            font-weight: 800;
            font-size: 1.5rem;
            color: white;
            opacity: 0; /* Hidden by default, JS handles the falloff */
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Active Highlight */
        .active-chord {
            font-size: 3.5rem !important;
            color: #0d6efd !important;
            text-shadow: 0 0 30px rgba(13,110,253,0.4);
        }

        #file-input { display: none; }
        
        .loader {
            position: absolute;
            z-index: 10;
            display: none;
            background: rgba(15, 17, 19, 0.8);
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="logo">
        <span class="flat">&#9837;</span><span class="name">akol AI</span>
    </div>

    <form id="upload-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input id="file-input" name="track" type="file" onchange="autoSubmit()"/>
        
        <div class="chord-stage shadow" onclick="document.getElementById('file-input').click()">
            <div id="loader" class="loader">
                <div class="spinner-border text-primary"></div>
            </div>

            <div id="conveyor">
                {% if not chords %}
                    <div style="color: #666; font-size: 0.9rem; letter-spacing: 1px;">CLICK TO ANALYZE AUDIO</div>
                {% else %}
                    {% for item in chords %}
                        <div class="chord-unit" id="chord-{{ forloop.index0 }}">
                            {{ item.chord }}
                        </div>
                    {% endfor %}
                {% endif %}
            </div>
        </div>
    </form>

    {% if file_url %}
        <div class="mx-auto" style="max-width: 500px;">
            <audio id="player" controls src="{{ file_url }}" class="w-100"></audio>
        </div>
    {% endif %}
</div>

{{ chords|json_script:"chords-raw" }}

<script>
    const chords = JSON.parse(document.getElementById('chords-raw').textContent || "[]");
    const player = document.getElementById('player');
    const conveyor = document.getElementById('conveyor');
    const slotWidth = 160; 

    function autoSubmit() {
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('upload-form').submit();
    }

    // Initial setup to show chords even before playing
    if (chords.length > 0) {
        updateCarousel(0);
    }

    function updateCarousel(idx) {
        // Calculate offset: we move by half a slot to center the first item correctly
        const offset = idx * slotWidth;
        conveyor.style.transform = `translateX(-${offset + (slotWidth/2)}px)`;

        document.querySelectorAll('.chord-unit').forEach((el, i) => {
            const distance = Math.abs(i - idx);
            
            if (i === idx) {
                el.classList.add('active-chord');
                el.style.opacity = "1";
            } else {
                el.classList.remove('active-chord');
                // Exponential falloff: 1 -> 0.3 -> 0.09 -> 0
                const opacity = Math.pow(0.3, distance);
                el.style.opacity = opacity < 0.05 ? "0" : opacity;
            }
        });
    }

    if (player && chords.length > 0) {
        player.addEventListener('timeupdate', () => {
            const time = player.currentTime;
            const idx = chords.findIndex(c => time >= c.start && time < c.end);
            if (idx !== -1) updateCarousel(idx);
        });
        
        // Listen for clicks on the progress bar
        player.addEventListener('seeked', () => {
            const idx = chords.findIndex(c => player.currentTime >= c.start && player.currentTime < c.end);
            if (idx !== -1) updateCarousel(idx);
        });
    }
</script>
</body>
</html>
